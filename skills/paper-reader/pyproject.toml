[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myresearchclaw-paper-reader"
version = "0.1.0"
description = "Deep paper reading pipeline for MyResearchClaw."
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
